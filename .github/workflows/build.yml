name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Generate Android host shell
        run: flutter create --platforms=android --org com.example --project-name pdfapp .

      - name: Patch android/build.gradle (Kotlin version)
        run: |
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '2.0.20'/" android/build.gradle
          grep -n kotlin_version android/build.gradle

      - name: Patch android/app/build.gradle (minSdk + compileSdk)
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' android/app/build.gradle
          echo "---- build.gradle android block ----"
          grep -nE 'minSdk|compileSdk|targetSdk' android/app/build.gradle

      - name: Patch AndroidManifest
        run: |
          python3 << 'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()

          perms = '''
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
          '''
          s = re.sub(r'(<manifest[^>]*>)', r'\1' + perms, s, count=1)

          queries = '''
              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE"/>
                  </intent>
              </queries>
          '''
          s = s.replace('</application>', queries + '</application>', 1)

          svc = '''
              <service android:name="com.ryanheise.audioservice.AudioService"
                       android:foregroundServiceType="mediaPlayback"
                       android:exported="true">
                  <intent-filter>
                      <action android:name="android.media.browse.MediaBrowserService"/>
                  </intent-filter>
              </service>
              <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                        android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.MEDIA_BUTTON"/>
                  </intent-filter>
              </receiver>
          '''
          s = s.replace('</application>', svc + '</application>', 1)
          open(p, 'w').write(s)
          print(open(p).read())
          PY

      - name: Pin flutter_tts to a Kotlin-compatible version
        run: |
          # flutter_tts 4.2.5 needs Kotlin 2.x; 4.0.2 works with Kotlin 1.9+
          sed -i 's/flutter_tts: \^4.0.2/flutter_tts: 4.0.2/' pubspec.yaml || true
          grep flutter_tts pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-read-aloud-apk
          path: build/app/outputs/flutter-apk/app-release.apk
