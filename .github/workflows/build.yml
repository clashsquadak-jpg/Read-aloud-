name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Generate Android host shell
        run: flutter create --platforms=android --org com.example --project-name pdfapp .

      - name: Write pubspec.yaml
        run: |
          python3 << 'PY'
          content = (
              "name: pdfapp\n"
              "description: PDF Read Aloud\n"
              "publish_to: 'none'\n"
              "version: 1.0.0+1\n"
              "environment:\n"
              "  sdk: '>=3.0.0 <4.0.0'\n"
              "dependencies:\n"
              "  flutter:\n"
              "    sdk: flutter\n"
              "  file_picker: ^8.0.0\n"
              "  syncfusion_flutter_pdf: ^25.2.3\n"
              "  syncfusion_flutter_pdfviewer: ^25.2.3\n"
              "  flutter_tts: 4.0.2\n"
              "  audio_service: ^0.18.15\n"
              "  cupertino_icons: ^1.0.6\n"
              "flutter:\n"
              "  uses-material-design: true\n"
          )
          open('pubspec.yaml', 'w').write(content)
          PY

      - name: Write lib/main.dart (clean version)
        run: |
          mkdir -p lib
          python3 << 'PY'
          import textwrap
          dart_code = textwrap.dedent(r"""
          import 'dart:io';
          import 'package:audio_service/audio_service.dart';
          import 'package:flutter/material.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:flutter_tts/flutter_tts.dart';
          import 'package:syncfusion_flutter_pdf/pdf.dart';
          import 'package:syncfusion_flutter_pdfviewer/pdfviewer.dart';

          late _Handler handler;

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const App());
          }

          String mathToSpeech(String t) {
            final rules = <List<String>>[
              [r'\\frac\{([^{}]+)\}\{([^{}]+)\}', r'$1 over $2'],
              [r'\\sqrt\{([^{}]+)\}', r'square root of $1'],
              [r'\^2\b', ' squared'],
              [r'\^3\b', ' cubed'],
              [r'\^\{?(\w+)\}?', r' to the power of $1'],
              [r'_\{?(\w+)\}?', r' sub $1'],
              [r'\\times', ' times '],
              [r'\\div', ' divided by '],
              [r'\\pm', ' plus or minus '],
              [r'\\leq', ' less than or equal to '],
              [r'\\geq', ' greater than or equal to '],
              [r'\\neq', ' not equal to '],
              [r'\\infty', ' infinity '],
              [r'\\sum', ' sum of '],
              [r'\\int', ' integral of '],
              [r'\\partial', ' partial '],
              [r'\\alpha', ' alpha '],
              [r'\\beta', ' beta '],
              [r'\\pi', ' pi '],
              [r'\\theta', ' theta '],
              [r'\\sigma', ' sigma '],
              [r'\\lambda', ' lambda '],
              ['\u00d7', ' times '],
              ['\u00f7', ' divided by '],
              ['\u00b1', ' plus or minus '],
              ['\u2264', ' less than or equal to '],
              ['\u2265', ' greater than or equal to '],
              ['\u221e', ' infinity '],
              ['\u221a', ' square root of '],
              ['\u03c0', ' pi '],
              ['%', ' percent '],
            ];
            for (final r in rules) {
              t = t.replaceAllMapped(RegExp(r[0]), (m) {
                var out = r[1];
                for (var i = 1; i <= m.groupCount; i++) {
                  out = out.replaceAll('\$$i', m.group(i) ?? '');
                }
                return out;
              });
            }
            t = t.replaceAll(RegExp(r'\\[a-zA-Z]+'), ' ');
            return t
                .replaceAll(RegExp(r'[{}]'), ' ')
                .replaceAll(RegExp(r'\s+'), ' ')
                .trim();
          }

          List<String> chunkText(String raw) {
            raw = raw.replaceAll(RegExp(r'\r\n|\r'), '\n');
            final paras = raw.split(RegExp(r'\n\s*\n'));
            final out = <String>[];
            for (var p in paras) {
              p = p.trim();
              if (p.isEmpty) continue;
              for (var s in p.split(RegExp(r'(?<=[.!?])\s+'))) {
                s = s.trim();
                if (s.isEmpty) continue;
                if (s.length <= 280) {
                  out.add(s);
                } else {
                  var buf = StringBuffer();
                  for (var part in s.split(RegExp(r',\s+'))) {
                    if (buf.length + part.length > 280 && buf.isNotEmpty) {
                      out.add(buf.toString().trim());
                      buf = StringBuffer();
                    }
                    buf.write('$part, ');
                  }
                  if (buf.toString().trim().isNotEmpty) {
                    out.add(buf.toString().trim());
                  }
                }
              }
            }
            return out;
          }

          Future<List<String>> extractChunks(File f) async {
            final doc = PdfDocument(inputBytes: await f.readAsBytes());
            final sb = StringBuffer();
            final ex = PdfTextExtractor(doc);
            for (var i = 0; i < doc.pages.count; i++) {
              sb.writeln(ex.extractText(startPageIndex: i, endPageIndex: i));
              sb.writeln('\n');
            }
            doc.dispose();
            return chunkText(sb.toString());
          }

          class _Handler extends BaseAudioHandler {
            final FlutterTts tts = FlutterTts();
            List<String> chunks = [];
            int idx = 0;
            double rate = 0.95;
            bool active = false;
            void Function(int newIndex)? onIndexChanged;

            Future<void> init() async {
              await tts.awaitSpeakCompletion(true);
              await tts.setSpeechRate(rate);
              final raw = await tts.getVoices;
              final voices = (raw as List).cast<Map>();
              final chosen = voices.firstWhere(
                (v) => '${v['locale']}'.contains('en-IN'),
                orElse: () => voices.firstWhere(
                  (v) => '${v['locale']}'.startsWith('en'),
                  orElse: () => <String, dynamic>{},
                ),
              );
              if (chosen.isNotEmpty) {
                await tts.setVoice(
                  chosen.map((k, v) => MapEntry(k.toString(), v.toString())),
                );
              }
              tts.setCompletionHandler(() {
                if (active) {
                  idx++;
                  onIndexChanged?.call(idx);
                  _speak();
                }
              });
              tts.setErrorHandler((_) {
                active = false;
                playbackState.add(playbackState.value.copyWith(playing: false));
              });
            }

            Future<List<Map<String, dynamic>>> voices() async {
              final raw = await tts.getVoices;
              return (raw as List)
                  .map((e) => Map<String, dynamic>.from(e as Map))
                  .toList();
            }

            Future<void> setRate(double r) async {
              rate = r;
              await tts.setSpeechRate(r);
            }

            Future<void> setVoice(String name) async {
              final v = (await voices()).firstWhere((e) => e['name'] == name);
              await tts.setVoice(
                v.map((k, val) => MapEntry(k.toString(), val.toString())),
              );
            }

            @override
            Future<void> play() async {
              if (active) {
                await tts.stop();
                await _speak();
              } else {
                active = true;
                await _speak();
              }
              playbackState.add(playbackState.value.copyWith(
                  processingState: AudioProcessingState.ready, playing: true));
            }

            @override
            Future<void> pause() async {
              await tts.pause();
              playbackState.add(playbackState.value.copyWith(playing: false));
            }

            @override
            Future<void> stop() async {
              active = false;
              await tts.stop();
              playbackState.add(playbackState.value.copyWith(
                  processingState: AudioProcessingState.idle, playing: false));
            }

            @override
            Future<void> skipToNext() async {
              if (idx < chunks.length - 1) {
                idx++;
                onIndexChanged?.call(idx);
                await tts.stop();
                if (active) _speak();
              }
            }

            @override
            Future<void> skipToPrevious() async {
              if (idx > 0) {
                idx--;
                onIndexChanged?.call(idx);
                await tts.stop();
                if (active) _speak();
              }
            }

            Future<void> _speak() async {
              if (idx >= chunks.length) {
                active = false;
                playbackState.add(playbackState.value.copyWith(
                    processingState: AudioProcessingState.completed,
                    playing: false));
                return;
              }
              await tts.speak(mathToSpeech(chunks[idx]));
              onIndexChanged?.call(idx);
              mediaItem.add(MediaItem(
                  id: 'c$idx',
                  title: 'Part ${idx + 1}/${chunks.length}',
                  artist: 'PDF Read Aloud'));
              playbackState.add(playbackState.value.copyWith(
                  processingState: AudioProcessingState.ready,
                  playing: true,
                  updatePosition: Duration.zero));
            }

            Future<void> speakOnly(String text) async {
              active = true;
              chunks = [text];
              idx = 0;
              await tts.stop();
              await _speak();
            }
          }

          class App extends StatelessWidget {
            const App({super.key});
            @override
            Widget build(BuildContext c) => MaterialApp(
                  theme: ThemeData(useMaterial3: true, colorSchemeSeed: Colors.indigo),
                  home: const Home(),
                );
          }

          class Home extends StatefulWidget {
            const Home({super.key});
            @override
            State<Home> createState() => _HomeState();
          }

          class _HomeState extends State<Home> {
            File? _pdfFile;
            final PdfViewerController _viewerCtrl = PdfViewerController();
            final GlobalKey<SfPdfViewerState> _viewerKey = GlobalKey();

            bool reading = false;
            bool paused = false;
            double rate = 0.95;
            String status = 'Pick a PDF first';
            String voiceLabel = 'Auto';
            List<Map<String, dynamic>> voices = [];
            List<String> _chunks = [];
            int _currentChunk = 0;
            String? _selectedText;

            Future<void> _pick() async {
              final res = await FilePicker.platform
                  .pickFiles(type: FileType.custom, allowedExtensions: ['pdf']);
              if (res == null) return;
              final f = File(res.files.single.path!);
              setState(() => status = 'Extracting...');
              final chunks = await extractChunks(f);
              setState(() {
                _pdfFile = f;
                _chunks = chunks;
                status = 'Ready: ${chunks.length} parts';
              });
            }

            Future<void> _start() async {
              if (_chunks.isEmpty) {
                setState(() => status = 'Pick a PDF first');
                return;
              }
              if (!reading) {
                handler = await AudioService.init(
                  builder: () => _Handler()..chunks = _chunks,
                  config: const AudioServiceConfig(
                    androidNotificationChannelId: 'pdf.read',
                    androidNotificationChannelName: 'PDF Read Aloud',
                    androidNotificationOngoing: false,
                    androidStopForegroundOnPause: true,
                  ),
                );
                await handler.init();
                handler.onIndexChanged = (i) {
                  if (mounted) setState(() => _currentChunk = i);
                };
                reading = true;
                final v = await handler.voices();
                setState(() {
                  voices = v;
                  voiceLabel = v.firstWhere(
                    (e) => '${e['locale']}'.contains('en-IN'),
                    orElse: () => v.firstWhere(
                      (e) => '${e['locale']}'.startsWith('en'),
                      orElse: () => <String, dynamic>{},
                    ),
                  )['name'] ??
                      'Default';
                });
              }
              await handler.play();
              setState(() {
                paused = false;
                status = 'Reading...';
              });
            }

            Future<void> _readSelection() async {
              if (_selectedText == null || _selectedText!.trim().isEmpty) {
                setState(() => status = 'Select some text first (long-press)');
                return;
              }
              if (!reading) {
                await _start();
              }
              await handler.speakOnly(_selectedText!);
              setState(() => status = 'Reading selection...');
            }

            @override
            Widget build(BuildContext c) => Scaffold(
                  appBar: AppBar(
                    title: const Text('PDF Read Aloud'),
                    actions: [
                      if (_pdfFile != null)
                        IconButton(
                          tooltip: 'Read selected text',
                          icon: const Icon(Icons.play_circle_outline),
                          onPressed: _readSelection,
                        ),
                    ],
                  ),
                  body: Column(children: [
                    Padding(
                      padding: const EdgeInsets.all(8),
                      child: Row(children: [
                        ElevatedButton.icon(
                          onPressed: _pick,
                          icon: const Icon(Icons.upload_file),
                          label: const Text('Pick PDF'),
                        ),
                        const SizedBox(width: 12),
                        Expanded(
                            child: Text(status, overflow: TextOverflow.ellipsis)),
                      ]),
                    ),
                    Expanded(
                      child: _pdfFile == null
                          ? const Center(child: Text('Pick a PDF to view and read'))
                          : SfPdfViewer.file(
                              _pdfFile!,
                              key: _viewerKey,
                              controller: _viewerCtrl,
                              enableTextSelection: true,
                              onTextSelectionChanged: (details) {
                                if (details.selectedText != null &&
                                    details.selectedText!.isNotEmpty) {
                                  setState(() =>
                                      _selectedText = details.selectedText);
                                }
                              },
                            ),
                    ),
                    if (reading)
                      Card(
                        margin: const EdgeInsets.all(8),
                        child: Padding(
                          padding: const EdgeInsets.all(12),
                          child: Column(children: [
                            if (voices.isNotEmpty)
                              DropdownButton<String>(
                                isExpanded: true,
                                value: voiceLabel,
                                items: voices
                                    .map((v) => DropdownMenuItem(
                                          value: v['name'] as String,
                                          child: Text(
                                              '${v['name']} (${v['locale']})'),
                                        ))
                                    .toList(),
                                onChanged: (v) {
                                  if (v == null) return;
                                  setState(() => voiceLabel = v);
                                  handler.setVoice(v);
                                },
                              ),
                            Row(children: [
                              const Text('Speed'),
                              Expanded(
                                child: Slider(
                                  value: rate,
                                  min: 0.5,
                                  max: 1.5,
                                  divisions: 20,
                                  label: rate.toStringAsFixed(2),
                                  onChanged: (v) => setState(() => rate = v),
                                  onChangeEnd: (v) => handler.setRate(v),
                                ),
                              ),
                              Text(rate.toStringAsFixed(2)),
                            ]),
                            Row(
                              mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                              children: [
                                IconButton(
                                  iconSize: 36,
                                  icon: const Icon(Icons.skip_previous),
                                  onPressed: () => handler.skipToPrevious(),
                                ),
                                IconButton(
                                  iconSize: 48,
                                  icon: Icon(paused
                                      ? Icons.play_arrow
                                      : Icons.pause),
                                  onPressed: () async {
                                    if (paused) {
                                      await handler.play();
                                    } else {
                                      await handler.pause();
                                    }
                                    setState(() => paused = !paused);
                                  },
                                ),
                                IconButton(
                                  iconSize: 36,
                                  icon: const Icon(Icons.skip_next),
                                  onPressed: () => handler.skipToNext(),
                                ),
                              ],
                            ),
                            Text(
                                'Part ${_currentChunk + 1} / ${_chunks.length}',
                                style: const TextStyle(
                                    fontSize: 12, color: Colors.grey)),
                          ]),
                        ),
                      ),
                    Padding(
                      padding: const EdgeInsets.all(8),
                      child: SizedBox(
                        width: double.infinity,
                        child: ElevatedButton.icon(
                          style: ElevatedButton.styleFrom(
                            padding: const EdgeInsets.symmetric(vertical: 16),
                            backgroundColor: Colors.indigo,
                            foregroundColor: Colors.white,
                          ),
                          onPressed: _start,
                          icon: const Icon(Icons.record_voice_over),
                          label: const Text('Read Aloud from start',
                              style: TextStyle(fontSize: 16)),
                        ),
                      ),
                    ),
                  ]),
                );
          }
          """)
          open('lib/main.dart', 'w').write(dart_code.strip() + '\n')
          PY

      - name: Patch app/build.gradle (SDK versions)
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/' android/app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' android/app/build.gradle
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' android/app/build.gradle

      - name: Patch settings.gradle (Kotlin plugin version)
        run: |
          if grep -q 'org.jetbrains.kotlin.android' android/settings.gradle; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.0.20"/' android/settings.gradle
          fi

      - name: Patch AndroidManifest
        run: |
          python3 << 'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = '''
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
          '''
          s = re.sub(r'(<manifest[^>]*>)', r'\1' + perms, s, count=1)
          queries = '''
              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE"/>
                  </intent>
              </queries>
          '''
          s = s.replace('</application>', queries + '</application>', 1)
          svc = '''
              <service android:name="com.ryanheise.audioservice.AudioService"
                       android:foregroundServiceType="mediaPlayback"
                       android:exported="true">
                  <intent-filter>
                      <action android:name="android.media.browse.MediaBrowserService"/>
                  </intent-filter>
              </service>
              <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                        android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.MEDIA_BUTTON"/>
                  </intent-filter>
              </receiver>
          '''
          s = s.replace('</application>', svc + '</application>', 1)
          open(p, 'w').write(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-read-aloud-apk
          path: build/app/outputs/flutter-apk/app-release.apk
